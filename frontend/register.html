<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CCTWW register</title>
        <link rel="stylesheet" href="register.css">
    </head>
    <body>
        <button id="openRegister" class="ghost-btn">Started with registration</button>

        <div class="dialog-backdrop" id="registerBackdrop" hidden>
            <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="registerTitle">

                <header class="dialog-head">
                    <div class="brand">
                        <span class="brand-eye" aria-hidden="true"></span>
                        <div>
                            <h2 id="registerTitle"></h2>
                            <p class="brand-sub"></p>
                        </div>
                    </div>
                    <button class="icon-btn" id="closeRegister" aria-label="關閉">✕</button>
                </header>

                <p class="dialog-desc"></p>

                <form id="registerForm" class="form" novalidate>
                    <!-- nickname -->
                    <label class="field" for="nickname">
                        <span class="field-label">
                            <span class="field-icon" aria-hidden="true">👤</span> Nickname
                        </span>
                        <input
                            type="text"
                            id="nickname"
                            name="nickname"
                            placeholder="例如：夜路觀察員"
                            autocomplete="off"
                            maxlength="20"
                        />
                        <span class="field-hint" id="nicknameHint"></span>
                    </label>

                    <!-- email -->
                    <label class="field" for="email">
                        <span class="field-label">
                            <span class="field-icon" aria-hidden="true">✉️</span> Email
                        </span>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="test@example.com"
                            autocomplete="off"
                        />
                        <span class="field-hint" id="emailHint"></span>
                    </label>

                    <!-- 狀態提示區 -->
                    <div class="status" id="statusBox" data-state="idle" hidden>
                        <span class="status-dot" aria-hidden="true"></span>
                        <span class="status-text" id="statusText"></span>
                    </div>

                    <button type="submit" class="primary-btn" id="submitBtn">
                        <span class="btn-label">開始遊戲</span>
                        <span class="spinner" aria-hidden="true"></span>
                    </button>
                </form>
            </div>
        </div>
        <script src="register.js"></script>
    </body>
</html>
